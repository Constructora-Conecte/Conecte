<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistencia - Conecte</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Constructora-Conecte/Conecte/main/Imagenes/Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:      #141414;
  --bg2:     #1c1c1c;
  --bg3:     #252525;
  --bg4:     #2e2e2e;
  --border:  rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text:    #e4e4e4;
  --text2:   #999;
  --text3:   #555;
  --white:   #fff;
  --red:     #e53e3e;
  --red-d:   #c53030;
  --green:   #48bb78;
  --yellow:  #ecc94b;
  --blue:    #63b3ed;
  --orange:  #ed8936;
  --font:'Inter',sans-serif;
  --r4:4px; --r8:8px; --r12:12px; --r16:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh; display:flex; flex-direction:column;
}

/* ── HEADER ── */
header{
  background:var(--bg2); border-bottom:1px solid var(--border);
  padding:14px 20px; display:flex; align-items:center; gap:10px; flex-shrink:0;
}
header img{height:30px; object-fit:contain}
#brandFallback{display:none; align-items:center; gap:8px}
#brandFallback .box{width:28px;height:28px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center}
header .titulo{font-size:14px; font-weight:700; color:var(--white)}
header .sub{font-size:11.5px; color:var(--text2); margin-left:auto}

/* ── LAYOUT ── */
main{
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:20px 16px 40px;
}
.wrap{
  width:100%; max-width:420px; display:flex; flex-direction:column; gap:14px;
}

.video-wrap{
  position:relative; width:100%; aspect-ratio:1/1; border-radius:var(--r16);
  overflow:hidden; background:#000; border:1px solid var(--border2);
}
video, canvas{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover}

.identidad{
  text-align:center; padding:14px; border-radius:var(--r12); background:var(--bg2);
  border:1px solid var(--border); min-height:26px;
}
.identidad .nombre{font-size:1.15rem; font-weight:800; color:var(--green)}
.identidad .sinid{color:var(--text2); font-weight:600; font-size:.92rem}

.ubic{
  text-align:center; font-size:.85rem; padding:9px; border-radius:var(--r8);
  background:var(--bg2); border:1px solid var(--border);
}
.ubic.dentro{color:var(--green)}
.ubic.fuera{color:var(--yellow)}

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
button.marc{
  padding:16px 10px; border:none; border-radius:var(--r8); font-size:.9rem;
  font-weight:700; cursor:pointer; color:#fff; font-family:var(--font);
  display:flex; flex-direction:column; align-items:center; gap:4px;
  transition:opacity .15s, transform .1s;
}
button.marc:active{transform:scale(.97)}
button.marc:disabled{opacity:.35; cursor:not-allowed; transform:none}
button.marc.hecho{ background:var(--bg3) !important; color:var(--text3); border:1px solid var(--border2) }
.b-entrada{background:var(--green)}
.b-salida{background:var(--red)}
.b-comida{background:var(--orange)}
.b-area{background:var(--blue); color:#0f172a}

.status{
  text-align:center; font-size:.87rem; padding:10px; border-radius:var(--r8);
  background:var(--bg2); border:1px solid var(--border); min-height:20px;
}
.status.ok{color:var(--green)} .status.err{color:var(--red)} .status.wait{color:var(--blue)}

footer{font-size:.7rem; color:var(--text3); text-align:center; margin-top:16px}

/* ── TOAST DE CONFIRMACIÓN ── */
#toast{
  position:fixed; top:-140px; left:50%; transform:translateX(-50%);
  width:min(92vw,420px); background:var(--green); color:#0f172a;
  border-radius:var(--r16); padding:20px; text-align:center; z-index:999;
  box-shadow:0 20px 50px rgba(0,0,0,.5); transition:top .35s cubic-bezier(.34,1.56,.64,1);
}
#toast.show{top:16px}
#toast .check{font-size:2.4rem; line-height:1}
#toast .titulo{font-size:1.05rem; font-weight:800; margin-top:4px}
#toast .detalle{font-size:.85rem; font-weight:500; opacity:.85; margin-top:2px}
#toast.err{background:var(--red); color:#fff}

/* ── RESPONSIVE ── */
@media (min-width:760px){
  .wrap{max-width:880px; flex-direction:row; align-items:flex-start; gap:24px}
  .col-video{flex:0 0 360px}
  .col-info{flex:1; display:flex; flex-direction:column; gap:14px}
}
@media (max-width:380px){
  .grid{gap:8px}
  button.marc{padding:13px 8px; font-size:.82rem}
  .video-wrap{border-radius:var(--r12)}
}
</style>
</head>
<body>

<header>
  <img src="https://raw.githubusercontent.com/Constructora-Conecte/Conecte/main/Imagenes/Logo.png" alt="Conecte"
       onerror="this.style.display='none';document.getElementById('brandFallback').style.display='flex'">
  <div id="brandFallback"><div class="box">🏗️</div><span class="titulo">CONECTE</span></div>
  <span class="titulo">Asistencia</span>
  <span class="sub">Marcaje biométrico</span>
</header>

<main>
  <div class="wrap">
    <div class="col-video">
      <div class="video-wrap">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>

    <div class="col-info">
      <div id="identidad" class="identidad"><span class="sinid">Buscando rostro...</span></div>
      <div id="ubicacion" class="ubic">Obteniendo ubicación GPS...</div>

      <div class="grid">
        <button id="btnEntrada" class="marc b-entrada" disabled>🟢<span>Entrada</span></button>
        <button id="btnSalida" class="marc b-salida" disabled>🔴<span>Salida</span></button>
        <button id="btnSalidaComida" class="marc b-comida" disabled>🍽️<span>Salida a comer</span></button>
        <button id="btnRegresoComida" class="marc b-comida" disabled>🍽️<span>Regreso de comer</span></button>
      </div>
      <button id="btnArea" class="marc b-area" disabled style="width:100%">📌<span>Llegada a área de trabajo</span></button>

      <div id="status" class="status wait">Cargando sistema...</div>
    </div>
  </div>
  <footer>Sistema de Marcaje Biométrico · Conecte</footer>
</main>

<div id="toast">
  <div class="check">✅</div>
  <div class="titulo" id="toastTitulo">Registrado</div>
  <div class="detalle" id="toastDetalle"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
// ============================================================
// ⚙️ CONFIG — edita aquí si algún día cambias de Apps Script
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbwE7EQorfA2aQc_q7mZCgMGjSBoIoHs-mulwkliNKNC9bpQNPlJLLz4M5EGbh3XA4MTIA/exec';
const UMBRAL_RECONOCIMIENTO = 0.5; // más bajo = match más estricto
// ============================================================

const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

const ETIQUETAS = {
  Entrada: 'Entrada', Salida: 'Salida',
  Salida_Comida: 'Salida a comer', Regreso_Comida: 'Regreso de comer',
  Llegada_Area_Trabajo: 'Llegada a área de trabajo'
};

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const identidadEl = document.getElementById('identidad');
const ubicacionEl = document.getElementById('ubicacion');
const btnMap = {
  Entrada: document.getElementById('btnEntrada'),
  Salida: document.getElementById('btnSalida'),
  Salida_Comida: document.getElementById('btnSalidaComida'),
  Regreso_Comida: document.getElementById('btnRegresoComida'),
  Llegada_Area_Trabajo: document.getElementById('btnArea')
};
const toastEl = document.getElementById('toast');
const toastTitulo = document.getElementById('toastTitulo');
const toastDetalle = document.getElementById('toastDetalle');

let rostrosConocidos = [];
let ubicaciones = [];
let empleadoActual = null;
let posicionActual = null;
let ubicacionDetectada = null;
let tiposHoyPorEmpleado = {}; // cache en memoria: {id: [tipos ya marcados hoy]} — se recarga siempre desde el servidor al cambiar de rostro o refrescar la página
let enviando = false;

function setStatus(msg, tipo){ statusEl.textContent = msg; statusEl.className = 'status ' + (tipo||'wait'); }

function pitido(ok){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = ok ? 880 : 300;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start(); osc.stop(ctx.currentTime + 0.18);
  } catch(e){}
}

function mostrarToast(ok, titulo, detalle){
  toastEl.classList.toggle('err', !ok);
  toastTitulo.textContent = titulo;
  toastDetalle.textContent = detalle;
  toastEl.querySelector('.check').textContent = ok ? '✅' : '⚠️';
  toastEl.classList.add('show');
  pitido(ok);
  setTimeout(() => toastEl.classList.remove('show'), 3200);
}

function actualizarBotonesEstado(){
  const yaHoy = empleadoActual ? (tiposHoyPorEmpleado[empleadoActual.id] || []) : [];
  Object.entries(btnMap).forEach(([tipo, btn]) => {
    const hecho = yaHoy.includes(tipo);
    btn.classList.toggle('hecho', hecho);
    btn.querySelector('span').textContent = hecho ? ETIQUETAS[tipo] + ' ✔' : ETIQUETAS[tipo];
    const listo = !!empleadoActual && !!posicionActual && !hecho && !enviando;
    btn.disabled = !listo;
  });
}

// ---------- Carga inicial ----------

async function cargarModelos(){
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
}

async function iniciarCamara(){
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

async function cargarDatos(){
  const [resRostros, resUbic] = await Promise.all([
    fetch(`${API_URL}?action=getRostros`),
    fetch(`${API_URL}?action=getUbicaciones`)
  ]);
  rostrosConocidos = await resRostros.json();
  ubicaciones = await resUbic.json();
}

// Siempre consulta al servidor (nunca confía solo en el estado local) para
// saber qué ya marcó el empleado hoy. Se llama cada vez que cambia el rostro
// identificado y en cada carga de página, así funciona igual entre
// dispositivos distintos, refrescos, o sesiones nuevas.
async function cargarRegistrosHoy(id){
  const res = await fetch(`${API_URL}?action=getRegistrosHoy&id=${encodeURIComponent(id)}`);
  tiposHoyPorEmpleado[id] = await res.json();
}

// ---------- Geolocalización ----------

function distanciaMetros(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function evaluarUbicacion(lat, lng){
  for (const punto of ubicaciones){
    const d = distanciaMetros(lat, lng, punto.lat, punto.lng);
    if (d <= punto.radio) return { nombre: punto.nombre, dentro: true };
  }
  return { nombre: null, dentro: false };
}

function iniciarGPS(){
  navigator.geolocation.watchPosition(pos => {
    posicionActual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    ubicacionDetectada = evaluarUbicacion(posicionActual.lat, posicionActual.lng);
    if (ubicacionDetectada.dentro){
      ubicacionEl.textContent = `📍 Dentro de: ${ubicacionDetectada.nombre}`;
      ubicacionEl.className = 'ubic dentro';
    } else {
      ubicacionEl.textContent = '⚠️ Fuera de puntos registrados (se marcará igual)';
      ubicacionEl.className = 'ubic fuera';
    }
    actualizarBotonesEstado();
  }, err => {
    ubicacionEl.textContent = 'No se pudo obtener el GPS: ' + err.message;
    ubicacionEl.className = 'ubic fuera';
  }, { enableHighAccuracy: true, maximumAge: 5000 });
}

// ---------- Reconocimiento facial ----------

function loopReconocimiento(){
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  const ctx = overlay.getContext('2d');

  const matcher = rostrosConocidos.length
    ? new faceapi.FaceMatcher(
        rostrosConocidos.map(r => new faceapi.LabeledFaceDescriptors(r.id, [new Float32Array(r.vector)])),
        UMBRAL_RECONOCIMIENTO
      )
    : null;

  setInterval(async () => {
    if (enviando) return;
    const deteccion = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks()
      .withFaceDescriptor();

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (!deteccion){
      empleadoActual = null;
      identidadEl.innerHTML = '<span class="sinid">Buscando rostro...</span>';
      actualizarBotonesEstado();
      return;
    }

    const box = deteccion.detection.box;

    if (!matcher){
      empleadoActual = null;
      identidadEl.innerHTML = '<span class="sinid">No hay rostros registrados aún</span>';
      ctx.strokeStyle = '#e53e3e';
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      actualizarBotonesEstado();
      return;
    }

    const match = matcher.findBestMatch(deteccion.descriptor);

    if (match.label === 'unknown'){
      empleadoActual = null;
      identidadEl.innerHTML = '<span class="sinid">Persona no identificada</span>';
      ctx.strokeStyle = '#e53e3e';
    } else {
      const emp = rostrosConocidos.find(r => r.id === match.label);
      const cambio = !empleadoActual || empleadoActual.id !== emp.id;
      empleadoActual = { id: emp.id, nombre: emp.nombre };
      identidadEl.innerHTML = `<span class="nombre">✅ ${emp.nombre}</span>`;
      ctx.strokeStyle = '#48bb78';
      if (cambio) { await cargarRegistrosHoy(emp.id); actualizarBotonesEstado(); }
    }
    ctx.lineWidth = 3;
    ctx.strokeRect(box.x, box.y, box.width, box.height);
    actualizarBotonesEstado();
  }, 400);
}

// ---------- Registrar marca ----------

async function marcar(tipo){
  if (!empleadoActual || !posicionActual || enviando) return;
  enviando = true;
  actualizarBotonesEstado();
  setStatus('Guardando marca...', 'wait');

  const payload = {
    action: 'marcar',
    id: empleadoActual.id,
    nombre: empleadoActual.nombre,
    tipo: tipo,
    lat: posicionActual.lat,
    lng: posicionActual.lng,
    ubicacion: ubicacionDetectada ? ubicacionDetectada.nombre : null,
    dentro: ubicacionDetectada ? ubicacionDetectada.dentro : false
  };

  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.ok){
      const horaTxt = data.hora ? ` · ${data.hora}` : '';
      setStatus(`✅ ${ETIQUETAS[tipo]} registrada para ${empleadoActual.nombre}`, 'ok');
      mostrarToast(true, `${ETIQUETAS[tipo]} registrada`, `${empleadoActual.nombre}${horaTxt}`);
      tiposHoyPorEmpleado[empleadoActual.id] = [...(tiposHoyPorEmpleado[empleadoActual.id]||[]), tipo];
    } else {
      setStatus('⚠️ ' + (data.error || 'No se pudo registrar'), 'err');
      mostrarToast(false, 'No se pudo registrar', data.error || '');
      // Puede que ya exista un registro que el frontend no había visto aún
      // (ej. lo marcaron desde otro dispositivo hace un momento). Volvemos a
      // consultar al servidor para que el botón quede bloqueado correctamente.
      await cargarRegistrosHoy(empleadoActual.id);
    }
  } catch (err) {
    setStatus('Error al guardar: ' + err.message, 'err');
    mostrarToast(false, 'Error de conexión', err.message);
  }
  enviando = false;
  actualizarBotonesEstado();
}

document.getElementById('btnEntrada').onclick = () => marcar('Entrada');
document.getElementById('btnSalida').onclick = () => marcar('Salida');
document.getElementById('btnSalidaComida').onclick = () => marcar('Salida_Comida');
document.getElementById('btnRegresoComida').onclick = () => marcar('Regreso_Comida');
document.getElementById('btnArea').onclick = () => marcar('Llegada_Area_Trabajo');

(async function init(){
  try {
    setStatus('Cargando modelos de reconocimiento facial...', 'wait');
    await cargarModelos();
    setStatus('Cargando datos de empleados y ubicaciones...', 'wait');
    await Promise.all([cargarDatos(), iniciarCamara()]);
    iniciarGPS();
    loopReconocimiento();
    setStatus('Listo. Colócate frente a la cámara.', 'ok');
  } catch (err) {
    setStatus('Error al iniciar: ' + err.message, 'err');
  }
})();
</script>
</body>
</html>
