<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enrolar Rostro - Admin</title>
<style>
  :root{
    --bg:#0f172a; --panel:#16213a; --accent:#38bdf8; --accent2:#22c55e;
    --text:#e5e9f0; --muted:#8b95ab; --danger:#f87171; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card{
    background:var(--panel); border-radius:var(--radius); padding:28px;
    max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  h1{font-size:1.3rem; margin:0 0 4px; letter-spacing:.3px;}
  p.sub{color:var(--muted); margin:0 0 20px; font-size:.9rem;}
  select{
    width:100%; padding:12px; border-radius:10px; border:1px solid #2a3654;
    background:#0d1526; color:var(--text); font-size:1rem; margin-bottom:16px;
  }
  .video-wrap{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:var(--radius);
    overflow:hidden; background:#000; margin-bottom:16px; border:2px solid #2a3654;
  }
  video, canvas{position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover;}
  .status{
    text-align:center; font-size:.95rem; padding:10px; border-radius:10px;
    background:#0d1526; margin-bottom:16px; min-height:20px;
  }
  .status.ok{color:var(--accent2);}
  .status.err{color:var(--danger);}
  .status.wait{color:var(--accent);}
  button{
    width:100%; padding:14px; border:none; border-radius:10px; font-size:1rem;
    font-weight:600; cursor:pointer; transition:opacity .2s;
  }
  button:disabled{opacity:.4; cursor:not-allowed;}
  .btn-main{background:var(--accent); color:#0f172a;}
  .btn-main:active{opacity:.8;}
  .logo{font-size:.75rem; color:var(--muted); text-align:center; margin-top:16px;}
</style>
</head>
<body>

<div class="card">
  <h1>🧑‍💼 Enrolamiento de rostro</h1>
  <p class="sub">Selecciona al empleado, encuadra su rostro y captura.</p>

  <select id="selectEmpleado">
    <option value="">Cargando empleados...</option>
  </select>

  <div class="video-wrap">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="overlay"></canvas>
  </div>

  <div id="status" class="status wait">Cargando modelos de reconocimiento facial...</div>

  <button id="btnCapturar" class="btn-main" disabled>Capturar y guardar rostro</button>

  <div class="logo">Sistema de Marcaje Biométrico</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<script>
// ================== CONFIGURA ESTO ==================
const API_URL = 'https://script.google.com/macros/s/AKfycbznliiqt_hVpVlJCojqZMGtRimo6ULks9h6Nq8aQXJhM3LPGCDqV0f3vOMS_dTEvKkpXA/exec';
// ======================================================

const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const btnCapturar = document.getElementById('btnCapturar');
const selectEmpleado = document.getElementById('selectEmpleado');

let modelosListos = false;

function setStatus(msg, tipo){
  statusEl.textContent = msg;
  statusEl.className = 'status ' + (tipo || 'wait');
}

async function cargarModelos(){
  await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
  await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
  await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
  modelosListos = true;
}

async function iniciarCamara(){
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
  video.srcObject = stream;
  return new Promise(resolve => video.onloadedmetadata = resolve);
}

async function cargarEmpleados(){
  const res = await fetch(`${API_URL}?action=getPersonal`);
  const empleados = await res.json();
  selectEmpleado.innerHTML = '<option value="">Selecciona un empleado...</option>';
  empleados.forEach(emp => {
    const opt = document.createElement('option');
    opt.value = emp.id;
    opt.textContent = emp.nombre;
    opt.dataset.nombre = emp.nombre;
    selectEmpleado.appendChild(opt);
  });
}

function loopDeteccion(){
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  const ctx = overlay.getContext('2d');

  setInterval(async () => {
    if (!modelosListos) return;
    const deteccion = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceLandmarks();

    ctx.clearRect(0, 0, overlay.width, overlay.height);
    if (deteccion) {
      const box = deteccion.detection.box;
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 3;
      ctx.strokeRect(box.x, box.y, box.width, box.height);
      btnCapturar.disabled = !selectEmpleado.value;
      if (selectEmpleado.value) setStatus('Rostro detectado. Listo para capturar.', 'ok');
    } else {
      btnCapturar.disabled = true;
      setStatus('No se detecta ningún rostro. Acércate a la cámara.', 'err');
    }
  }, 300);
}

btnCapturar.addEventListener('click', async () => {
  btnCapturar.disabled = true;
  setStatus('Procesando rostro...', 'wait');

  const deteccion = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
    .withFaceLandmarks()
    .withFaceDescriptor();

  if (!deteccion) {
    setStatus('No se pudo capturar el rostro, intenta de nuevo.', 'err');
    btnCapturar.disabled = false;
    return;
  }

  const opt = selectEmpleado.selectedOptions[0];
  const payload = {
    action: 'enrolar',
    id: selectEmpleado.value,
    nombre: opt.dataset.nombre,
    vector: Array.from(deteccion.descriptor)
  };

  try {
    await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    setStatus(`✅ Rostro de ${opt.dataset.nombre} guardado correctamente.`, 'ok');
  } catch (err) {
    setStatus('Error al guardar: ' + err.message, 'err');
  }
  btnCapturar.disabled = false;
});

(async function init(){
  try {
    setStatus('Cargando modelos de reconocimiento facial...', 'wait');
    await Promise.all([cargarModelos(), iniciarCamara(), cargarEmpleados()]);
    loopDeteccion();
    setStatus('Selecciona un empleado y encuadra su rostro.', 'wait');
  } catch (err) {
    setStatus('Error al iniciar: ' + err.message, 'err');
  }
})();
</script>
</body>
</html>
